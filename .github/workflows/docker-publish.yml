name: Publish Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        env:
          REGISTRY: ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://turriva.com

      # Marketing HTML is Cache-Control: no-store + Cloudflare DYNAMIC — there is no
      # Prerender.io / Bot Cache / SSR snapshot layer to purge. After Coolify pulls
      # :latest, bots and browsers both hit Origin fresh. Verify with:
      #   curl -sI https://www.turriva.com/ar -A Googlebot | grep -i 'cache-control\|cf-cache'
      - name: Note — no bot prerender cache to invalidate
        run: |
          echo "No Prerender/Bot-Cache layer on turriva.com HTML."
          echo "Origin serves private,no-store; cf-cache-status=DYNAMIC for browser and Googlebot alike."
          echo "Coolify redeploy of ghcr image is the only refresh needed."
